<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="САСАВОТ Community: клипы, мемы, творчество и IRL нашего комьюнити.">
  <meta property="og:title" content="САСАВОТ Community">
  <meta property="og:description" content="Главное место комьюнити Сасавота.">
  <meta property="og:image" content="/assets/images/community-night.png">
  <title>САСАВОТ Community</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23e33d2e%22/><text x=%2250%22 y=%2268%22 text-anchor=%22middle%22 font-size=%2258%22 font-family=%22Arial%22 font-weight=%22900%22 fill=%22white%22>С</text></svg>">
  <link rel="stylesheet" href="/vendor/phosphor/regular/style.css?v=1">
  <link rel="stylesheet" href="/vendor/phosphor/fill/style.css?v=1">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
  <a class="skip-link" href="#main">К контенту</a>
  <div class="grain" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="brand" href="#/feed" aria-label="САСАВОТ, главная">
        <span class="brand-mark">С</span>
        <span class="brand-copy"><b>САСАВОТ</b><small>COMMUNITY</small></span>
      </a>
      <nav id="primary-nav" class="primary-nav"></nav>
      <button class="publish-button" type="button" data-action="publish"><i class="ph ph-plus"></i><span>Опубликовать</span></button>
      <div class="sidebar-footer">
        <a href="#/rules">Правила</a>
        <a href="#/about">О проекте</a>
        <button type="button" data-action="theme" aria-label="Сменить тему"><i class="ph ph-moon"></i> Тема</button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" type="button" data-action="mobile-menu" aria-label="Открыть меню"><i class="ph ph-list"></i></button>
        <form class="search" id="search-form" role="search">
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <input id="search-input" type="search" name="q" autocomplete="off" placeholder="Найти пост, автора или хэштег" aria-label="Поиск">
          <kbd>⌘ K</kbd>
          <div id="search-popover" class="search-popover" hidden></div>
        </form>
        <div class="topbar-actions">
          <button class="icon-button" type="button" data-route="notifications" aria-label="Уведомления"><i class="ph ph-bell"></i><span id="notification-dot" class="notification-dot" hidden></span></button>
          <button id="account-button" class="account-button" type="button" data-action="account">Войти</button>
        </div>
      </header>

      <div class="page-grid">
        <main id="main" class="main-content" tabindex="-1">
          <div class="skeleton hero-skeleton"></div>
          <div class="skeleton post-skeleton"></div>
        </main>
        <aside id="right-rail" class="right-rail" aria-label="Информация сообщества"></aside>
      </div>
    </div>
  </div>

  <nav id="mobile-nav" class="mobile-nav" aria-label="Мобильная навигация"></nav>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/js/app.js?v=2"></script>
</body>
</html>
